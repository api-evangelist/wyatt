aid: wyatt
name: Wyatt
description: 'Wyatt Corp. (주식회사 와이어트) is a South Korean beauty and personal-care
  company headquartered in Gangnam, Seoul. It owns and operates the Dr.FORHAIR scalp
  and hair-care brand — ranked first in the Korea Consumer Satisfaction Index shampoo
  category for twelve consecutive years — alongside the UNOVE and Tangle Angel brands,
  and it built and operated Kakao Hair Shop, the salon-booking service inside KakaoTalk.
  Wyatt is a consumer-products company rather than a software vendor: it publishes no
  developer portal, no public API program and no OpenAPI. Its only machine-readable,
  agent-callable surface is the Model Context Protocol endpoint attached to its
  Dr.FORHAIR direct-to-consumer storefront, which is operated on its behalf by the
  Cafe24 commerce platform and advertised from Wyatt''s own domain via RFC 9728
  protected-resource metadata.'
