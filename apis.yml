apis:
- name: Dr.FORHAIR Storefront MCP Server
  description: 'A live, remotely-callable Model Context Protocol server for Wyatt''s
    Dr.FORHAIR direct-to-consumer storefront. Six tools cover catalog search, product
    detail, checkout-URL creation, customer order history, order detail, and
    cancellation of an unpaid order. The server is operated by the Cafe24 commerce
    platform on a tenant-scoped host (drforhair2024.cafe24api.com) and is advertised
    from Wyatt''s own domain at https://drforhair.co.kr/.well-known/oauth-protected-resource.
    Anonymous initialize and tools/list succeed; the tools themselves require an
    OAuth 2.1 authorization-code + PKCE token.'
  humanURL: https://drforhair.co.kr/
  image: https://drforhair.co.kr/web/upload/share-image-1-2b0d3336e497f1cc904d314e5eed16c8.png
  baseURL: https://drforhair2024.cafe24api.com/api/mcp
  x-operator: tenant
  x-operator-note: >-
    Wyatt owns the shop, the catalog and the orders; the MCP runtime and its six tools are
    Cafe24's, provisioned per merchant on a tenant subdomain. Wyatt did not engineer this
    contract.
