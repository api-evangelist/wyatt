operator_note: >-
  The server identifies itself as serverInfo.name "cafe24-mcp-server" v1.0.0. It is the Cafe24
  commerce platform's agentic-commerce runtime, provisioned per merchant on a tenant subdomain.
  Wyatt owns the shop (tenant "drforhair2024") and the products the tools return, and advertises
  the endpoint from its own registrable domain, but Wyatt did not author the tool surface — the
  same six tools appear on every Cafe24 tenant that has the feature enabled. Recorded per the
  platform-vs-provider authorship rule; do not read this as Wyatt shipping an MCP server of its
  own design.
deployment:
