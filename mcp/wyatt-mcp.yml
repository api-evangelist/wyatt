introspection:
  anonymous_initialize: true
  anonymous_tools_list: true
  session_required: true
  session_header: mcp-session-id
  note: >-
    tools/list without a session returns HTTP 400 {"error":"Session ID required"}. After an
    initialize handshake the full tool set — including complete inputSchemas — is returned
    anonymously. Calling a tool requires an OAuth 2.1 bearer token; the catalog did not attempt
    any tools/call.
  files:
