    resources: wyatt-mcp-resources.json
    prompts: wyatt-mcp-prompts.json
    initialize: wyatt-mcp-initialize.json
tool_count: 6
tools:
- name: search-products
  category: catalog
  write: false
  summary: Search the storefront catalog by product name, with optional situational tag, price
    floor/ceiling, sort field, sort direction and result limit.
  required: [product_name]
  parameters: [product_name, product_tag, price_min, price_max, sort, order, limit]
- name: search-products-detail
  category: catalog
  write: false
  summary: Retrieve the detail record for one product number, optionally expanding variants with
    per-option surcharge and option axes.
  required: [product_no]
  parameters: [product_no, shop_no, variants_verbose]
- name: create-checkout-url
  category: checkout
  write: true
  summary: Generate a checkout URL for a given product variant and quantity. Produces a URL for a
    human to complete; it does not itself place an order.
  required: [product_no, variant_code, quantity]
  parameters: [product_no, variant_code, quantity]
- name: search-customer-orders
  category: orders
  write: false
  summary: List the authenticated customer's orders over a 1-90 day window with limit/offset paging.
  required: []
  parameters: [period_days, limit, offset, shop_no]
- name: search-customer-order-detail
  category: orders
  write: false
  summary: Retrieve one order by order_id (format YYYYMMDD-NNNNNNN).
  required: [order_id]
  parameters: [order_id, shop_no]
- name: cancel-unpaid-order
  category: orders
  write: true
  reversal_of: create-checkout-url
  summary: Immediately cancel an order that is still in the pre-payment state.
  required: [order_id]
  parameters: [order_id, shop_no]
resources:
- uri: ui://widget/product-list.html
  name: Product List Template
- uri: ui://widget/product-detail.html
  name: Product Detail Template
prompts_count: 6
prompts: [search-products, search-products-detail, create-checkout-url, search-customer-orders,
  search-customer-order-detail, cancel-unpaid-order]
language_note: >-
  Every tool and prompt description is written in Korean. An agent operating this surface must be
  able to read Korean tool descriptions, and the catalog it returns is the Korean-language
  Dr.FORHAIR storefront.
