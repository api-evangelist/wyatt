tools:
- name: search-products
  description: '상품을 검색하는 도구입니다. 상품명뿐 아니라 추천 상황(예: 계절, 스타일, 장소, 용도) 등을 함께 입력하면 보다 정교한 검색이 가능합니다.'
  category: catalog
  write: false
  summary: Search the storefront catalog by product name, with optional situational tag, price floor/ceiling,
    sort field, sort direction and result limit.
  required:
  - product_name
  parameters:
  - product_name
  - product_tag
  - price_min
  - price_max
  - sort
  - order
  - limit
- name: search-products-detail
  description: 상품번호에 해당하는 상품 상세를 검색합니다.
  category: catalog
  write: false
  summary: Retrieve the detail record for one product number, optionally expanding variants with per-option
    surcharge and option axes.
  required:
  - product_no
  parameters:
  - product_no
  - shop_no
  - variants_verbose
- name: create-checkout-url
  description: 지정한 상품의 체크아웃 URL을 생성합니다.
  category: checkout
  write: true
  summary: Generate a checkout URL for a given product variant and quantity. Produces a URL for a human
    to complete; it does not itself place an order.
  required:
  - product_no
  - variant_code
  - quantity
  parameters:
  - product_no
  - variant_code
  - quantity
- name: search-customer-orders
  description: 고객의 주문 내역을 검색합니다. '내 주문 목록', '최근 구매 내역', '주문 확인해줘' 등의 요청에 사용합니다.
  category: orders
  write: false
  summary: List the authenticated customer's orders over a 1-90 day window with limit/offset paging.
  required: []
  parameters:
  - period_days
  - limit
  - offset
  - shop_no
- name: search-customer-order-detail
  description: 특정 주문의 상세 정보를 조회합니다. '주문번호 20260101-0000001 상세 보여줘', '이 주문 자세히 알려줘' 등의 요청에 사용합니다.
  category: orders
  write: false
  summary: Retrieve one order by order_id (format YYYYMMDD-NNNNNNN).
  required:
  - order_id
  parameters:
  - order_id
  - shop_no
- name: cancel-unpaid-order
  description: 입금 전 상태의 주문을 즉시 취소합니다.
  category: orders
  write: true
  reversal_of: create-checkout-url
  summary: Immediately cancel an order that is still in the pre-payment state.
  required:
  - order_id
  parameters:
  - order_id
  - shop_no
resources:
- uri: ui://widget/product-list.html
  name: Product List Template
- uri: ui://widget/product-detail.html
